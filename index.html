<!doctype html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC DOCUMENT SETTINGS
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <meta
        name="theme-color"
        content="#080914"
    />

    <meta
        name="color-scheme"
        content="dark light"
    />

    <meta
        name="format-detection"
        content="telephone=no"
    />


    <!-- =====================================================
         SEO
    ====================================================== -->

    <title>
        GoodOneCreation — Digital Innovation Ecosystem
    </title>

    <meta
        name="description"
        content="GoodOneCreation is a digital innovation ecosystem focused on creativity, technology, AI, Web3, gaming, education, digital products and modern online experiences."
    />

    <meta
        name="robots"
        content="index, follow"
    />

    <meta
        name="googlebot"
        content="index, follow"
    />

    <meta
        name="author"
        content="GoodOneCreation"
    />

    <meta
        name="keywords"
        content="GoodOneCreation, digital ecosystem, digital innovation, creative technology, AI, Web3, gaming, education, digital products, digital platforms"
    />


    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
        rel="icon"
        type="image/x-icon"
        href="/favicon.ico"
    />

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="/favicon-32x32.png"
    />

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="/favicon-16x16.png"
    />

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="/apple-touch-icon.png"
    />


    <!-- =====================================================
         WEB APP / MOBILE
    ====================================================== -->

    <meta
        name="mobile-web-app-capable"
        content="yes"
    />

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    />

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    />

    <meta
        name="apple-mobile-web-app-title"
        content="GoodOneCreation"
    />


    <!-- =====================================================
         OPEN GRAPH — FACEBOOK / WHATSAPP / LINK SHARING
    ====================================================== -->

    <meta
        property="og:type"
        content="website"
    />

    <meta
        property="og:title"
        content="GoodOneCreation — Digital Innovation Ecosystem"
    />

    <meta
        property="og:description"
        content="Explore creativity, technology, AI, Web3, gaming, education, digital products and modern digital experiences with GoodOneCreation."
    />

    <meta
        property="og:site_name"
        content="GoodOneCreation"
    />


    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    />

    <meta
        name="twitter:title"
        content="GoodOneCreation — Digital Innovation Ecosystem"
    />

    <meta
        name="twitter:description"
        content="A digital ecosystem focused on creativity, technology, AI, Web3, gaming, education and modern digital experiences."
    />


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://cdnjs.cloudflare.com"
        crossorigin
    />

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

</head>


<body>

    <div id="root"></div>

    <script
        type="module"
        src="/src/main.jsx">
    </script>

</body>

</html>
